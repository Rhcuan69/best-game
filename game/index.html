<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Lumen: guide a lantern firefly through the night garden, gather ember orbs, dodge shadow wisps.">
<meta name="theme-color" content="#070a12">
<title>Lumen — a lantern firefly game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lumen: guide the lantern firefly with WASD or the mouse, gather ember orbs, dodge the shadow wisps"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
